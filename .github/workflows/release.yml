name: Release

# Push a tag equal to the manifest version (e.g. 0.0.2) to publish a release
# that BRAT can install on the iPad.
on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches manifest version
        run: test "$(jq -r .version manifest.json)" = "${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --notes "GitHub API sync $GITHUB_REF_NAME"
